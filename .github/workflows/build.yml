name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # .NET Framework 4.8 plugin; the reference-assemblies package lets the .NET SDK build it anywhere,
    # but MusicBee is Windows-only, so build where it runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/SpotiBee/SpotiBee.csproj -c Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: mb_SpotiBee
          path: src/SpotiBee/bin/Release/net48/mb_SpotiBee.dll
          if-no-files-found: error
